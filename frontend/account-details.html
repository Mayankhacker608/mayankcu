<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Account Details | Northstar Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/account-details.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-slate-100">
    <div class="flex min-h-screen">
      <aside class="hidden w-72 flex-col border-r border-slate-200 bg-slate-950 text-slate-200 lg:flex">
        <div class="flex items-center gap-3 border-b border-slate-800 px-6 py-5">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-700 text-lg font-bold text-white">N</div>
          <div>
            <p class="font-bold text-white">Northstar</p>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Banking</p>
          </div>
        </div>
        <nav class="flex-1 space-y-2 px-4 py-6">
          <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Dashboard</span></a>
          <a href="customers.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Customers</span></a>
          <a href="accounts.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Accounts</span></a>
          <a href="transactions.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Transactions</span></a>
          <a href="payments.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Payments</span></a>
          <a href="reports.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Reports</span></a>
          <a href="profile.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Profile</span></a>
          <button id="logout-button" class="mt-6 w-full rounded-xl border border-slate-700 px-3 py-3 text-left text-sm font-medium text-slate-200 hover:bg-slate-800">Logout</button>
        </nav>
      </aside>

      <div class="flex-1">
        <header class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
          <div class="flex items-center justify-between px-6 py-4">
            <div class="relative">
              <input id="global-search" type="search" placeholder="Search account details..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm md:w-80" />
              <div id="search-results" class="search-panel hidden overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"><div id="search-results-list"></div></div>
            </div>
            <div class="flex items-center gap-4">
              <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600" id="today-date"></div>
              <div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-sky-100 font-semibold text-sky-700" id="user-name-initials">U</div>
                <div class="hidden text-left sm:block"><p class="text-sm font-medium text-slate-800" id="user-name">User</p><p class="text-[10px] uppercase tracking-[0.2em] text-slate-500" id="user-role">Role</p></div>
              </div>
            </div>
          </div>
        </header>

        <main class="p-6">
          <div class="mb-6 flex items-center justify-between">
            <div>
              <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-700">Portfolio</p>
              <h1 class="mt-2 text-3xl font-black text-slate-900">Account details</h1>
            </div>
            <a href="accounts.html" class="rounded-xl border border-slate-200 bg-white px-4 py-2.5 font-medium text-slate-700">Back to accounts</a>
          </div>

          <div class="mb-6 grid gap-4 md:grid-cols-3">
            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-lg shadow-slate-200/40">
              <p class="text-sm text-slate-500">Account number</p>
              <p id="summary-account-number" class="mt-2 text-2xl font-black text-slate-900">—</p>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-lg shadow-slate-200/40">
              <p class="text-sm text-slate-500">Customer</p>
              <p id="summary-customer" class="mt-2 text-2xl font-black text-slate-900">—</p>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-5 shadow-lg shadow-slate-200/40">
              <p class="text-sm text-slate-500">Balance</p>
              <p id="summary-balance" class="mt-2 text-2xl font-black text-slate-900">—</p>
            </div>
          </div>

          <div class="grid gap-6 xl:grid-cols-[1.1fr,0.9fr]">
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-200/40">
              <h2 class="text-xl font-black text-slate-900">Account profile</h2>
              <form id="account-details-form" class="mt-5 space-y-4">
                <div>
                  <label class="mb-2 block text-sm font-medium text-slate-700">Customer</label>
                  <select id="account-customer" name="customer" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"></select>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                  <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Account type</label>
                    <select name="accountType" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
                      <option value="Savings">Savings</option>
                      <option value="Current">Current</option>
                      <option value="Business">Business</option>
                      <option value="Corporate">Corporate</option>
                    </select>
                  </div>
                  <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Status</label>
                    <select name="status" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm">
                      <option value="Active">Active</option>
                      <option value="Suspended">Suspended</option>
                      <option value="Closed">Closed</option>
                    </select>
                  </div>
                </div>
                <div class="grid gap-4 md:grid-cols-2">
                  <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Currency</label>
                    <input name="currency" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
                  </div>
                  <div>
                    <label class="mb-2 block text-sm font-medium text-slate-700">Balance</label>
                    <input name="balance" type="number" min="0" step="0.01" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" />
                  </div>
                </div>
                <div class="flex gap-3">
                  <button type="submit" class="rounded-xl bg-brand-700 px-4 py-3 font-medium text-white">Save changes</button>
                  <button type="button" id="delete-account" class="rounded-xl border border-rose-200 bg-rose-50 px-4 py-3 font-medium text-rose-700">Delete</button>
                </div>
              </form>
            </div>

            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-200/40">
              <h2 class="text-xl font-black text-slate-900">Recent transactions</h2>
              <div class="mt-5 overflow-hidden rounded-2xl border border-slate-200">
                <table class="min-w-full text-left text-sm">
                  <thead class="bg-slate-50 text-slate-500">
                    <tr>
                      <th class="px-3 py-3 font-medium">Type</th>
                      <th class="px-3 py-3 font-medium">Amount</th>
                      <th class="px-3 py-3 font-medium">Date</th>
                    </tr>
                  </thead>
                  <tbody id="account-transactions-body"></tbody>
                </table>
              </div>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
