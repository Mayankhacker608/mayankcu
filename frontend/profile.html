<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Profile | Northstar Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/profile.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-slate-100">
    <div class="flex min-h-screen">
      <aside class="hidden w-72 flex-col border-r border-slate-200 bg-slate-950 text-slate-200 lg:flex">
        <div class="flex items-center gap-3 border-b border-slate-800 px-6 py-5">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-700 text-lg font-bold text-white">N</div>
          <div>
            <p class="font-bold text-white">Northstar</p>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Banking</p>
          </div>
        </div>
        <nav class="flex-1 space-y-2 px-4 py-6">
          <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Dashboard</span></a>
          <a href="customers.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Customers</span></a>
          <a href="accounts.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Accounts</span></a>
          <a href="transactions.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Transactions</span></a>
          <a href="payments.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Payments</span></a>
          <a href="reports.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Reports</span></a>
          <a href="profile.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Profile</span></a>
          <button id="logout-button" class="mt-6 w-full rounded-xl border border-slate-700 px-3 py-3 text-left text-sm font-medium text-slate-200 hover:bg-slate-800">Logout</button>
        </nav>
      </aside>
      <div class="flex-1">
        <header class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
          <div class="flex items-center justify-between px-6 py-4">
            <div class="relative"><input id="global-search" type="search" placeholder="Search profiles..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm md:w-80" /><div id="search-results" class="search-panel hidden overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl"><div id="search-results-list"></div></div></div>
            <div class="flex items-center gap-4"><div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600" id="today-date"></div><div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2"><div class="flex h-10 w-10 items-center justify-center rounded-full bg-sky-100 font-semibold text-sky-700" id="user-name-initials">U</div><div class="hidden text-left sm:block"><p class="text-sm font-medium text-slate-800" id="user-name">User</p><p class="text-[10px] uppercase tracking-[0.2em] text-slate-500" id="user-role">Role</p></div></div></div>
          </div>
        </header>
        <main class="p-6">
          <div class="mb-6"><p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-700">Account</p><h1 class="mt-2 text-3xl font-black text-slate-900">Profile</h1></div>
          <div class="grid gap-6 xl:grid-cols-2">
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-200/40">
              <h2 class="text-lg font-bold text-slate-800">Personal details</h2>
              <form id="profile-form" class="mt-5 space-y-4">
                <div><label class="mb-2 block text-sm font-medium text-slate-700">Full name</label><input id="profile-name" name="fullName" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
                <div><label class="mb-2 block text-sm font-medium text-slate-700">Phone</label><input id="profile-phone" name="phone" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
                <div><label class="mb-2 block text-sm font-medium text-slate-700">Email</label><input id="profile-email" class="w-full rounded-xl border border-slate-200 bg-slate-100 px-3 py-2.5 text-sm" disabled /></div>
                <button type="submit" class="rounded-xl bg-brand-700 px-4 py-3 font-medium text-white">Save changes</button>
              </form>
            </div>
            <div class="rounded-3xl border border-slate-200 bg-white p-6 shadow-lg shadow-slate-200/40">
              <h2 class="text-lg font-bold text-slate-800">Security</h2>
              <form id="password-form" class="mt-5 space-y-4">
                <div><label class="mb-2 block text-sm font-medium text-slate-700">Current password</label><input name="currentPassword" type="password" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
                <div><label class="mb-2 block text-sm font-medium text-slate-700">New password</label><input name="newPassword" type="password" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
                <div><label class="mb-2 block text-sm font-medium text-slate-700">Confirm password</label><input name="confirmPassword" type="password" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
                <button type="submit" class="rounded-xl bg-slate-900 px-4 py-3 font-medium text-white">Update password</button>
              </form>
            </div>
          </div>
        </main>
      </div>
    </div>
  </body>
</html>
