<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Northstar Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/auth.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-slate-100" data-page="login">
    <div class="flex min-h-screen items-center justify-center p-6">
      <div
        class="auth-card w-full max-w-md rounded-3xl border border-slate-200 bg-white p-8 shadow-2xl shadow-slate-200/60"
      >
        <div class="mb-8 text-center">
          <div
            class="mx-auto flex h-16 w-16 items-center justify-center rounded-2xl bg-brand-700 text-2xl font-black text-white"
          >
            N
          </div>
          <h1 class="mt-5 text-3xl font-black text-slate-900">Welcome back</h1>
          <p class="mt-2 text-sm text-slate-600">
            Sign in to your financial workspace
          </p>
        </div>

        <form id="login-form" class="auth-form space-y-5">
          <div class="auth-field">
            <label
              for="email"
              class="mb-2 block text-sm font-medium text-slate-700"
              >Email</label
            >
            <input
              id="email"
              name="email"
              type="email"
              required
              class="auth-input w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm"
              placeholder="you@company.com"
            />
          </div>

          <div class="auth-field">
            <label
              for="password"
              class="mb-2 block text-sm font-medium text-slate-700"
              >Password</label
            >
            <div class="relative">
              <input
                id="password"
                name="password"
                type="password"
                required
                class="auth-input w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 pr-12 text-sm"
                placeholder="••••••••"
              />
              <button
                type="button"
                id="toggle-password"
                class="auth-toggle absolute right-3 top-3 text-sm font-medium text-slate-500"
              >
                Show
              </button>
            </div>
          </div>

          <div class="flex items-center justify-between text-sm">
            <label class="inline-flex items-center gap-2 text-slate-600"
              ><input type="checkbox" class="h-4 w-4" /> Remember me</label
            >
            <a href="#" class="text-brand-700">Forgot password?</a>
          </div>

          <div
            id="auth-message"
            class="hidden rounded-xl border border-red-200 bg-red-50 px-3 py-2 text-sm text-red-600"
          ></div>

          <button
            type="submit"
            class="auth-submit w-full rounded-xl px-4 py-3 font-medium text-white"
          >
            Sign in
          </button>
        </form>

        <p class="mt-7 text-center text-sm text-slate-600">
          Need an account?
          <a href="register.html" class="font-semibold text-brand-700"
            >Create one</a
          >
        </p>
      </div>
    </div>
  </body>
</html>
