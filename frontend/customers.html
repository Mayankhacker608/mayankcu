<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Customers | Northstar Banking</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="assets/js/config.js"></script>
    <script src="assets/js/api.js"></script>
    <script src="assets/js/common.js"></script>
    <script src="assets/js/customers.js"></script>
    <link rel="stylesheet" href="assets/css/style.css" />
  </head>
  <body class="bg-slate-100">
    <div class="flex min-h-screen">
      <aside class="hidden w-72 flex-col border-r border-slate-200 bg-slate-950 text-slate-200 lg:flex">
        <div class="flex items-center gap-3 border-b border-slate-800 px-6 py-5">
          <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-brand-700 text-lg font-bold text-white">N</div>
          <div>
            <p class="font-bold text-white">Northstar</p>
            <p class="text-[10px] uppercase tracking-[0.2em] text-slate-400">Banking</p>
          </div>
        </div>
        <nav class="flex-1 space-y-2 px-4 py-6">
          <a href="dashboard.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Dashboard</span></a>
          <a href="customers.html" class="sidebar-link active flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Customers</span></a>
          <a href="accounts.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Accounts</span></a>
          <a href="transactions.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Transactions</span></a>
          <a href="payments.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Payments</span></a>
          <a href="reports.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Reports</span></a>
          <a href="profile.html" class="sidebar-link flex items-center gap-3 rounded-xl px-3 py-3 text-sm font-medium"><span>Profile</span></a>
          <button id="logout-button" class="mt-6 w-full rounded-xl border border-slate-700 px-3 py-3 text-left text-sm font-medium text-slate-200 hover:bg-slate-800">Logout</button>
        </nav>
      </aside>

      <div class="flex-1">
        <header class="border-b border-slate-200 bg-white/90 backdrop-blur-sm">
          <div class="flex items-center justify-between px-6 py-4">
            <div class="relative">
              <input id="global-search" type="search" placeholder="Search customers..." class="w-full rounded-xl border border-slate-200 bg-slate-50 px-4 py-2.5 text-sm md:w-80" />
              <div id="search-results" class="search-panel hidden overflow-hidden rounded-2xl border border-slate-200 bg-white shadow-xl">
                <div id="search-results-list"></div>
              </div>
            </div>
            <div class="flex items-center gap-4">
              <div class="rounded-xl border border-slate-200 bg-slate-50 px-3 py-2 text-sm text-slate-600" id="today-date"></div>
              <div class="flex items-center gap-3 rounded-xl border border-slate-200 bg-slate-50 px-3 py-2">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-sky-100 font-semibold text-sky-700" id="user-name-initials">U</div>
                <div class="hidden text-left sm:block">
                  <p class="text-sm font-medium text-slate-800" id="user-name">User</p>
                  <p class="text-[10px] uppercase tracking-[0.2em] text-slate-500" id="user-role">Role</p>
                </div>
              </div>
            </div>
          </div>
        </header>

        <main class="p-6">
          <div class="mb-6 flex flex-col gap-3 md:flex-row md:items-center md:justify-between">
            <div>
              <p class="text-sm font-semibold uppercase tracking-[0.2em] text-brand-700">Operations</p>
              <h1 class="mt-2 text-3xl font-black text-slate-900">Customers</h1>
            </div>
            <button id="new-customer-button" class="rounded-xl bg-brand-700 px-4 py-3 font-medium text-white shadow-lg shadow-brand-700/20">New customer</button>
          </div>

          <div class="mb-6 rounded-3xl border border-slate-200 bg-white p-4 shadow-lg shadow-slate-200/40">
            <div class="grid gap-4 md:grid-cols-4">
              <input id="search-input" type="search" placeholder="Search by name or email" class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm" />
              <select id="status-filter" class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                <option value="">All statuses</option>
                <option value="Active">Active</option>
                <option value="Inactive">Inactive</option>
              </select>
              <select id="sort-filter" class="rounded-xl border border-slate-200 bg-slate-50 px-4 py-3 text-sm">
                <option value="newest">Newest</option>
                <option value="oldest">Oldest</option>
                <option value="name">Name</option>
              </select>
              <button id="apply-filters" class="rounded-xl bg-slate-900 px-4 py-3 font-medium text-white">Apply</button>
            </div>
          </div>

          <div class="rounded-3xl border border-slate-200 bg-white p-4 shadow-lg shadow-slate-200/40">
            <div class="table-scroll">
              <table class="min-w-full text-left text-sm">
                <thead class="text-slate-500">
                  <tr><th class="pb-3 font-medium">Customer</th><th class="pb-3 font-medium">Email</th><th class="pb-3 font-medium">Phone</th><th class="pb-3 font-medium">Status</th><th class="pb-3 font-medium">Actions</th></tr>
                </thead>
                <tbody id="customers-table-body"></tbody>
              </table>
            </div>
          </div>
        </main>
      </div>
    </div>

    <div id="customer-modal" class="fixed inset-0 hidden items-center justify-center bg-slate-900/40 p-4">
      <div class="w-full max-w-2xl rounded-3xl bg-white p-6 shadow-2xl">
        <div class="mb-5 flex items-center justify-between">
          <h2 id="modal-title" class="text-2xl font-black text-slate-900">Customer</h2>
          <button id="close-modal" class="text-2xl text-slate-500">×</button>
        </div>
        <form id="customer-form" class="grid gap-4 md:grid-cols-2">
          <input type="hidden" id="customer-id" />
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Full name</label><input id="customer-name" name="fullName" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" required /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Email</label><input id="customer-email" name="email" type="email" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" required /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Phone</label><input id="customer-phone" name="phone" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" required /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Status</label><select id="customer-status" name="status" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm"><option value="Active">Active</option><option value="Inactive">Inactive</option></select></div>
          <div class="md:col-span-2"><label class="mb-2 block text-sm font-medium text-slate-700">Address</label><input id="customer-address" name="address" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">City</label><input id="customer-city" name="city" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">State</label><input id="customer-state" name="state" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Country</label><input id="customer-country" name="country" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
          <div><label class="mb-2 block text-sm font-medium text-slate-700">Postal Code</label><input id="customer-postal" name="postalCode" class="w-full rounded-xl border border-slate-200 px-3 py-2.5 text-sm" /></div>
          <div class="md:col-span-2 flex justify-end gap-3">
            <button type="button" id="cancel-customer" class="rounded-xl border border-slate-300 px-4 py-2.5 font-medium text-slate-700">Cancel</button>
            <button type="submit" class="rounded-xl bg-brand-700 px-4 py-2.5 font-medium text-white">Save customer</button>
          </div>
        </form>
      </div>
    </div>
  </body>
</html>
